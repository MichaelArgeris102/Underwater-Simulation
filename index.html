<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underwater Simulation</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
</head>
<body>

  <div id="gameover-overlay" class="hidden">
    <div id="gameover-box">
      <p id="go-title"></p>
      <p id="go-score"></p>
      <p id="go-time"></p>
      <div id="gameover-buttons">
        <button onclick="startGame('hunter')">Hunter</button>
        <button onclick="startGame('prey')">Prey</button>
      </div>
    </div>
  </div>

  <div id="menu-overlay">
    <div id="menu-box">
      <h1>Underwater</h1>
      <p>choose your role</p>
      <div id="menu-buttons">
        <button class="role-button" onclick="startGame('hunter')" aria-label="Play as shark" title="Play as shark">
          <span class="role-sprite shark-role" aria-hidden="true"></span>
        </button>
        <button class="role-button" onclick="startGame('prey')" aria-label="Play as fish" title="Play as fish">
          <span class="role-sprite fish-role" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Load order matters: base class first, then subclass, then sketch -->
  <script src="SwimmingEntity.js"></script>
  <script src="Fish.js"></script>
  <script src="Shark.js"></script>
  <script src="sketch.js"></script>

</body>
</html>
